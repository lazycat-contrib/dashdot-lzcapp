version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/dashdot.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: dash

build:
  toolchains: []
  run_buildscript: false

images:
  - id: dash
    target: service
    service: dash
    source: mauricenino/dashdot
    channel: stable
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: false
    changelog_locales: [zh, en]
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Dashdot
    summary: Published from GitHub Actions

