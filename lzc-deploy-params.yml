params:
  - id: widget_list
    type: string
    name: "Widget List"
    description: "Comma-separated values: os, cpu, storage, ram, network, gpu."
    optional: true
    default_value: "os,cpu,storage,ram,network"

  - id: port
    type: string
    name: "Port"
    description: "Backend port. Changing it also updates the LazyCat upstream target. Enter a numeric value as text."
    optional: true
    default_value: "3001"

  - id: routing_path
    type: string
    name: "Routing Path"
    description: "Path where Dashdot is served, for example / or /dashdot."
    optional: true
    default_value: "/"

  - id: page_title
    type: string
    name: "Page Title"
    description: "Browser page title."
    optional: false
    default_value: "dash."

  - id: disable_integrations
    type: bool
    name: "Disable Integrations"
    description: "Disable CORS and open API integration endpoints."
    optional: true
    default_value: "false"

  - id: disable_background_stats_collection
    type: bool
    name: "Disable Background Stats Collection"
    description: "Disable background metric collection."
    optional: true
    default_value: "false"

  - id: show_dash_version
    type: string
    name: "Show Dashdot Version"
    description: "Allowed values: bottom_right, icon_hover, none."
    optional: true
    default_value: "icon_hover"

  - id: use_imperial
    type: bool
    name: "Use Imperial"
    description: "Show imperial rather than metric units."
    optional: true
    default_value: "false"

  - id: always_show_percentages
    type: bool
    name: "Always Show Percentages"
    description: "Always show graph percentages."
    optional: true
    default_value: "false"

  - id: os_label_list
    type: string
    name: "OS Label List"
    description: "Comma-separated values: os, arch, up_since, dash_version."
    optional: true
    default_value: "os,arch,up_since"

  - id: show_host
    type: bool
    name: "Show Host"
    description: "Show the host in the server widget."
    optional: true
    default_value: "false"

  - id: custom_host
    type: string
    name: "Custom Host"
    description: "Custom host shown when Show Host is enabled."
    optional: true

  - id: os_widget_grow
    type: string
    name: "OS Widget Grow"
    description: "Relative size of the server widget. Enter a numeric value as text."
    optional: true
    default_value: "2.5"

  - id: os_widget_min_width
    type: string
    name: "OS Widget Min Width"
    description: "Minimum server widget width in pixels. Enter a numeric value as text."
    optional: true
    default_value: "300"

  - id: override_os
    type: string
    name: "Override OS"
    description: "Override the detected operating system name."
    optional: true

  - id: override_arch
    type: string
    name: "Override Arch"
    description: "Override the detected system architecture."
    optional: true

  - id: cpu_label_list
    type: string
    name: "CPU Label List"
    description: "Comma-separated values: brand, model, cores, threads, frequency."
    optional: true
    default_value: "brand,model,cores,threads,frequency"

  - id: enable_cpu_temps
    type: bool
    name: "Enable CPU Temps"
    description: "Enable CPU temperature display; it may not work on a VPS."
    optional: true
    default_value: "false"

  - id: cpu_temps_mode
    type: string
    name: "CPU Temps Mode"
    description: "Allowed values: avg, max."
    optional: true
    default_value: "avg"

  - id: cpu_cores_toggle_mode
    type: string
    name: "CPU Cores Toggle Mode"
    description: "Allowed values: toggle, multi-core, average."
    optional: true
    default_value: "toggle"

  - id: cpu_widget_grow
    type: string
    name: "CPU Widget Grow"
    description: "Relative size of the CPU widget. Enter a numeric value as text."
    optional: true
    default_value: "4"

  - id: cpu_widget_min_width
    type: string
    name: "CPU Widget Min Width"
    description: "Minimum CPU widget width in pixels. Enter a numeric value as text."
    optional: true
    default_value: "500"

  - id: cpu_shown_datapoints
    type: string
    name: "CPU Shown Datapoints"
    description: "Number of datapoints in the CPU graph. Enter a numeric value as text."
    optional: true
    default_value: "20"

  - id: cpu_poll_interval
    type: string
    name: "CPU Poll Interval"
    description: "CPU polling interval in milliseconds. Enter a numeric value as text."
    optional: true
    default_value: "1000"

  - id: override_cpu_brand
    type: string
    name: "Override CPU Brand"
    description: "Override the detected CPU brand."
    optional: true

  - id: override_cpu_model
    type: string
    name: "Override CPU Model"
    description: "Override the detected CPU model."
    optional: true

  - id: override_cpu_cores
    type: string
    name: "Override CPU Cores"
    description: "Override the detected CPU core count. Enter a numeric value as text."
    optional: true

  - id: override_cpu_threads
    type: string
    name: "Override CPU Threads"
    description: "Override the detected CPU thread count. Enter a numeric value as text."
    optional: true

  - id: override_cpu_frequency
    type: string
    name: "Override CPU Frequency"
    description: "Override CPU frequency in GHz, for example 2.8. Enter a numeric value as text."
    optional: true

  - id: storage_label_list
    type: string
    name: "Storage Label List"
    description: "Comma-separated values: brand, size, type."
    optional: true
    default_value: "brand,size,type"

  - id: fs_device_filter
    type: string
    name: "FS Device Filter"
    description: "Comma-separated device names to hide."
    optional: true

  - id: fs_type_filter
    type: string
    name: "FS Type Filter"
    description: "Comma-separated filesystem types to hide."
    optional: true
    default_value: "cifs,9p,fuse.rclone,fuse.mergerfs,nfs4,iso9660,fuse.shfs,autofs"

  - id: fs_virtual_mounts
    type: string
    name: "FS Virtual Mounts"
    description: "Comma-separated virtual filesystem names to display."
    optional: true

  - id: storage_widget_items_per_page
    type: string
    name: "Storage Widget Items Per Page"
    description: "Number of storage items per page. Enter a numeric value as text."
    optional: true
    default_value: "3"

  - id: storage_widget_grow
    type: string
    name: "Storage Widget Grow"
    description: "Relative size of the storage widget. Enter a numeric value as text."
    optional: true
    default_value: "3.5"

  - id: storage_widget_min_width
    type: string
    name: "Storage Widget Min Width"
    description: "Minimum storage widget width in pixels. Enter a numeric value as text."
    optional: true
    default_value: "500"

  - id: storage_poll_interval
    type: string
    name: "Storage Poll Interval"
    description: "Storage polling interval in milliseconds. Enter a numeric value as text."
    optional: true
    default_value: "60000"

  - id: override_storage_brands
    type: string
    name: "Override Storage Brands"
    description: "Comma-separated device=brand pairs, for example sda=Samsung."
    optional: true

  - id: override_storage_sizes
    type: string
    name: "Override Storage Sizes"
    description: "Comma-separated device=size-in-bytes pairs."
    optional: true

  - id: override_storage_types
    type: string
    name: "Override Storage Types"
    description: "Comma-separated device=type pairs, for example sda=SSD."
    optional: true

  - id: ram_label_list
    type: string
    name: "RAM Label List"
    description: "Comma-separated values: brand, size, type, frequency."
    optional: true
    default_value: "brand,size,type,frequency"

  - id: ram_widget_grow
    type: string
    name: "RAM Widget Grow"
    description: "Relative size of the memory widget. Enter a numeric value as text."
    optional: true
    default_value: "4"

  - id: ram_widget_min_width
    type: string
    name: "RAM Widget Min Width"
    description: "Minimum memory widget width in pixels. Enter a numeric value as text."
    optional: true
    default_value: "500"

  - id: ram_shown_datapoints
    type: string
    name: "RAM Shown Datapoints"
    description: "Number of datapoints in the memory graph. Enter a numeric value as text."
    optional: true
    default_value: "20"

  - id: ram_poll_interval
    type: string
    name: "RAM Poll Interval"
    description: "Memory polling interval in milliseconds. Enter a numeric value as text."
    optional: true
    default_value: "1000"

  - id: override_ram_brand
    type: string
    name: "Override RAM Brand"
    description: "Override the detected memory brand."
    optional: true

  - id: override_ram_size
    type: string
    name: "Override RAM Size"
    description: "Override memory size in bytes. Enter a numeric value as text."
    optional: true

  - id: override_ram_type
    type: string
    name: "Override RAM Type"
    description: "Override the detected memory type."
    optional: true

  - id: override_ram_frequency
    type: string
    name: "Override RAM Frequency"
    description: "Override the detected memory frequency. Enter a numeric value as text."
    optional: true

  - id: network_label_list
    type: string
    name: "Network Label List"
    description: "Comma-separated values: type, speed_up, speed_down, interface_speed, public_ip."
    optional: true
    default_value: "type,speed_up,speed_down,interface_speed"

  - id: accept_ookla_eula
    type: bool
    name: "Accept Ookla EULA"
    description: "Use Ookla speedtest and accept its EULA, Terms, and Privacy Policy."
    optional: true
    default_value: "false"

  - id: use_network_interface
    type: string
    name: "Use Network Interface"
    description: "Network interface to use instead of the detected gateway."
    optional: true

  - id: speed_test_from_path
    type: string
    name: "Speed Test From Path"
    description: "Path to a speed-test JSON file; Docker host paths must start with /mnt/host."
    optional: true

  - id: network_speed_as_bytes
    type: bool
    name: "Network Speed As Bytes"
    description: "Show bytes per second instead of bits per second."
    optional: true
    default_value: "false"

  - id: speed_test_interval
    type: string
    name: "Speed Test Interval"
    description: "Speed-test interval in minutes. Enter a numeric value as text."
    optional: true
    default_value: "240"

  - id: speed_test_interval_cron
    type: string
    name: "Speed Test Interval Cron"
    description: "Cron expression that overrides the numeric speed-test interval."
    optional: true

  - id: network_widget_grow
    type: string
    name: "Network Widget Grow"
    description: "Relative size of the network widget. Enter a numeric value as text."
    optional: true
    default_value: "6"

  - id: network_widget_min_width
    type: string
    name: "Network Widget Min Width"
    description: "Minimum network widget width in pixels. Enter a numeric value as text."
    optional: true
    default_value: "500"

  - id: network_shown_datapoints
    type: string
    name: "Network Shown Datapoints"
    description: "Number of datapoints in each network graph. Enter a numeric value as text."
    optional: true
    default_value: "20"

  - id: network_poll_interval
    type: string
    name: "Network Poll Interval"
    description: "Network polling interval in milliseconds. Enter a numeric value as text."
    optional: true
    default_value: "1000"

  - id: override_network_type
    type: string
    name: "Override Network Type"
    description: "Override the detected network type."
    optional: true

  - id: override_network_speed_up
    type: string
    name: "Override Network Speed Up"
    description: "Override upload speed in bits per second. Enter a numeric value as text."
    optional: true

  - id: override_network_speed_down
    type: string
    name: "Override Network Speed Down"
    description: "Override download speed in bits per second. Enter a numeric value as text."
    optional: true

  - id: override_network_interface_speed
    type: string
    name: "Override Network Interface Speed"
    description: "Override interface speed in megabits per second. Enter a numeric value as text."
    optional: true

  - id: override_network_public_ip
    type: string
    name: "Override Network Public IP"
    description: "Override the detected public IP address."
    optional: true

  - id: gpu_label_list
    type: string
    name: "GPU Label List"
    description: "Comma-separated values: brand, model, memory."
    optional: true
    default_value: "brand, model, memory"

  - id: gpu_brand_filter
    type: string
    name: "GPU Brand Filter"
    description: "Comma-separated, case-sensitive GPU brands to show."
    optional: true

  - id: gpu_model_filter
    type: string
    name: "GPU Model Filter"
    description: "Comma-separated, case-sensitive GPU models to show."
    optional: true

  - id: gpu_widget_grow
    type: string
    name: "GPU Widget Grow"
    description: "Relative size of the GPU widget. Enter a numeric value as text."
    optional: true
    default_value: "6"

  - id: gpu_widget_min_width
    type: string
    name: "GPU Widget Min Width"
    description: "Minimum GPU widget width in pixels. Enter a numeric value as text."
    optional: true
    default_value: "700"

  - id: gpu_shown_datapoints
    type: string
    name: "GPU Shown Datapoints"
    description: "Number of datapoints in the GPU graph. Enter a numeric value as text."
    optional: true
    default_value: "20"

  - id: gpu_poll_interval
    type: string
    name: "GPU Poll Interval"
    description: "GPU polling interval in milliseconds. Enter a numeric value as text."
    optional: true
    default_value: "1000"

  - id: override_gpu_brands
    type: string
    name: "Override GPU Brands"
    description: "Comma-separated GPU brands; empty positions preserve detected values."
    optional: true

  - id: override_gpu_models
    type: string
    name: "Override GPU Models"
    description: "Comma-separated GPU models; empty positions preserve detected values."
    optional: true

  - id: override_gpu_memories
    type: string
    name: "Override GPU Memories"
    description: "Comma-separated GPU memory sizes in MiB; empty positions preserve detected values."
    optional: true

