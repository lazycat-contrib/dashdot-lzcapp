      description: "配置 覆盖存储类型（DASHDOT_OVERRIDE_STORAGE_TYPES）。默认不设置，仅在填写后生效。"
    ram_label_list:
      name: "内存信息字段"
      description: "配置 内存信息字段（DASHDOT_RAM_LABEL_LIST）。官方默认值：brand,size,type,frequency。"
    ram_widget_grow:
      name: "内存组件相对宽度"
