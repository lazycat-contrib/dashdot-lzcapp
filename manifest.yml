      - >-
        {{ printf "DASHDOT_SPEED_TEST_INTERVAL=%s" .U.speed_test_interval | quote }}
{{ with .U.speed_test_interval_cron }}
      - >-
        {{ printf "DASHDOT_SPEED_TEST_INTERVAL_CRON=%s" . | quote }}
{{ end }}
      - >-
        {{ printf "DASHDOT_NETWORK_WIDGET_GROW=%s" .U.network_widget_grow | quote }}
      - >-
        {{ printf "DASHDOT_NETWORK_WIDGET_MIN_WIDTH=%s" .U.network_widget_min_width | quote }}
      - >-
        {{ printf "DASHDOT_NETWORK_SHOWN_DATAPOINTS=%s" .U.network_shown_datapoints | quote }}
      - >-
        {{ printf "DASHDOT_NETWORK_POLL_INTERVAL=%s" .U.network_poll_interval | quote }}
{{ with .U.override_network_type }}
      - >-
        {{ printf "DASHDOT_OVERRIDE_NETWORK_TYPE=%s" . | quote }}
{{ end }}
{{ with .U.override_network_speed_up }}
      - >-
        {{ printf "DASHDOT_OVERRIDE_NETWORK_SPEED_UP=%s" . | quote }}
{{ end }}
{{ with .U.override_network_speed_down }}
      - >-
        {{ printf "DASHDOT_OVERRIDE_NETWORK_SPEED_DOWN=%s" . | quote }}
{{ end }}
{{ with .U.override_network_interface_speed }}
      - >-
        {{ printf "DASHDOT_OVERRIDE_NETWORK_INTERFACE_SPEED=%s" . | quote }}
{{ end }}
{{ with .U.override_network_public_ip }}
      - >-
        {{ printf "DASHDOT_OVERRIDE_NETWORK_PUBLIC_IP=%s" . | quote }}
{{ end }}
      - >-
        {{ printf "DASHDOT_GPU_LABEL_LIST=%s" .U.gpu_label_list | quote }}
{{ with .U.gpu_brand_filter }}
      - >-
        {{ printf "DASHDOT_GPU_BRAND_FILTER=%s" . | quote }}
{{ end }}
{{ with .U.gpu_model_filter }}
      - >-
        {{ printf "DASHDOT_GPU_MODEL_FILTER=%s" . | quote }}
{{ end }}
      - >-
        {{ printf "DASHDOT_GPU_WIDGET_GROW=%s" .U.gpu_widget_grow | quote }}
      - >-
        {{ printf "DASHDOT_GPU_WIDGET_MIN_WIDTH=%s" .U.gpu_widget_min_width | quote }}
      - >-
        {{ printf "DASHDOT_GPU_SHOWN_DATAPOINTS=%s" .U.gpu_shown_datapoints | quote }}
      - >-
        {{ printf "DASHDOT_GPU_POLL_INTERVAL=%s" .U.gpu_poll_interval | quote }}
{{ with .U.override_gpu_brands }}
      - >-
        {{ printf "DASHDOT_OVERRIDE_GPU_BRANDS=%s" . | quote }}
{{ end }}
{{ with .U.override_gpu_models }}
      - >-
        {{ printf "DASHDOT_OVERRIDE_GPU_MODELS=%s" . | quote }}
{{ end }}
{{ with .U.override_gpu_memories }}
      - >-
        {{ printf "DASHDOT_OVERRIDE_GPU_MEMORIES=%s" . | quote }}
{{ end }}
